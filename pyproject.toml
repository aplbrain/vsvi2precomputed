[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vsvi2precomputed"
version = "0.1.0"
description = "VAST to Precomputed converter"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Daniel Xenes", email = "daniel.xenes@jhuapl.edu" },
]
keywords = ["VAST", "Precomputed", "VSVI", "Neuroglancer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "boto3==1.35.99",
    "cloud-volume==11.1.5",
    "joblib",
    "pillow",
    "tqdm",
]

[project.scripts]
vsv2precomputed = "vsvi2precomputed.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
packages = ["vsvi2precomputed"]

[tool.setuptools.package-data]
vsvi2precomputed = ["py.typed"]
